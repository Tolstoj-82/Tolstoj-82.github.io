<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GBTDC Qual</title><style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e5e3d9;padding:20px;font-family:'Press Start 2P','Courier New',monospace;color:#293e25}.frame{width:100%;max-width:490px;background:#cecdc2;border:3px solid #a5a59b;border-radius:16px 16px 35px 16px;padding:18px;box-shadow:inset 3px 3px #f1f0e9,5px 7px 0 #aaa99e}.bezel{background:#575967;border-radius:10px 10px 25px 10px;padding:14px 13px 22px}.stripe{display:flex;align-items:center;gap:9px;margin-bottom:15px}.lines{flex:1;display:flex;flex-direction:column;gap:5px;min-width:12px}.purple{height:4px;background:#994875;border-radius:2px}.blue{height:4px;background:#455c9e;border-radius:2px}.name{width:170px;max-width:56%;min-width:90px;text-align:center;background:transparent;border:0;outline:none;color:white;font:700 clamp(9px,2.3vw,13px) Arial,sans-serif;letter-spacing:1px;text-transform:uppercase;padding:5px 1px}.name:focus{outline:1px dashed #ddd}.lcd{font-family:'Press Start 2P','Courier New',monospace;background:#acbf87;border:3px solid #7c9064;box-shadow:inset 3px 4px 9px #738955;padding:24px 12px;color:#2b4225}.heading{text-align:center;font-size:clamp(16px,4.5vw,24px);line-height:1.7;margin-bottom:19px}.time{width:100%;background:transparent;border:0;outline:none;text-align:center;font-family:inherit;font-size:clamp(19px,5.3vw,31px);letter-spacing:-1px;color:#293f24;font-variant-numeric:tabular-nums;padding:9px 0}.time:focus{background:#c6d6a1;outline:2px dashed #61764e;border-radius:4px}.flash{animation:blink .35s steps(1,end) 8}@keyframes blink{50%{opacity:0}}.rule{height:2px;background:#758d5e;margin:22px 0 7px}.score-row{display:flex;flex-direction:column;align-items:stretch;gap:13px;padding:21px 0;border-bottom:2px solid #829969;font-size:clamp(14px,3.5vw,18px);line-height:1.6}.score-row input{width:100%;max-width:100%;text-align:right;background:transparent;border:0;border-bottom:1px dashed #738a60;outline:none;color:#2b4225;font-family:inherit;font-size:clamp(17px,4.6vw,23px);border-radius:0;padding:8px 0;min-width:0}.score-row input:focus{background:#c6d6a1}.average{display:block;width:100%;font-size:clamp(17px,4.6vw,23px);overflow-wrap:anywhere;text-align:right;line-height:1.8}.actions{display:flex;justify-content:center;gap:20px;margin:25px 0 8px;flex-wrap:wrap}.actions button{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:800;letter-spacing:1px;border:2px solid #622344;background:linear-gradient(145deg,#a44a7b,#79284f);color:#fff0f7;border-radius:999px;padding:14px 24px;cursor:pointer;box-shadow:inset 1px 2px 2px #c26b9a,0 5px 0 #4a2039,0 7px 5px #34462a55}.actions button:active{transform:translateY(4px);box-shadow:inset 1px 2px 4px #4d1936,0 1px 0 #4a2039}
</style><link rel="stylesheet" href="timer.css"></head><body><button class="settings-button" id="openSettings" aria-label="Open appearance settings">⚙</button><main class="frame" id="timerFrame"><div class="bezel"><div class="stripe"><div class="lines"><div class="purple"></div><div class="blue"></div></div><div class="name-picker"><input class="name" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="savedNames" autocomplete="off" id="name" value="DOT MATRIX" maxlength="22" aria-label="Custom name"><button id="toggleNames" aria-label="Show saved timer names" aria-expanded="false" title="Saved timer names"><span class="name-chevron" aria-hidden="true"></span></button><div id="savedNames" role="listbox" hidden></div></div><div class="lines"><div class="purple"></div><div class="blue"></div></div></div><div class="lcd"><div class="heading" contenteditable="plaintext-only" role="textbox" aria-label="Timer title" aria-multiline="false" tabindex="0" spellcheck="false" title="Click to edit title">GBTDC Qual</div><input class="time" id="time" value="1:30:00" aria-label="Hours minutes seconds" inputmode="numeric" autocomplete="off" spellcheck="false" aria-describedby="timeHint"><span id="timeHint" class="sr-only">Type digits from right to left: 13000 sets 1 hour 30 minutes. Colons are automatic. Enter confirms.</span><div class="rule"></div><div class="score-row"><label for="s1">SCORE 1:</label><input id="s1" type="text" inputmode="numeric" placeholder="0"></div><div class="score-row"><label for="s2">SCORE 2:</label><input id="s2" type="text" inputmode="numeric" placeholder="0"></div><div class="score-row" id="score3Row" hidden><label for="s3">SCORE 3:</label><input id="s3" type="text" inputmode="numeric" placeholder="0"></div><div class="score-row" style="border-bottom:0"><span id="averageLabel">AO2:</span><span class="average" id="avg">—</span></div></div></div><div class="actions"><button id="start">▶ START</button><button id="reset">↺ RESET</button></div><span class="resize-handle east" data-resize="e" aria-hidden="true"></span><span class="resize-handle south" data-resize="s" aria-hidden="true"></span></main><dialog id="settings"><form method="dialog" class="modal-header"><header><h2>Timer settings</h2><button aria-label="Close settings">✕</button></header></form><p class="hint">Changes are saved on this browser.</p><div class="modal-timer-controls"><button type="button" id="modalStart">Start / pause</button><button type="button" id="modalReset">Reset timer</button></div><p class="hint">Keyboard: Space starts or pauses; R resets (outside text fields). These work when timer buttons are hidden.</p><div id="settingsFields"></div><button id="restoreAppearance" type="button">Restore default appearance</button></dialog><script src="sound.js"></script><script src="settings.js"></script><script>
(()=>{const $=id=>document.getElementById(id),time=$('time'),start=$('start'),s1=$('s1'),s2=$('s2'),s3=$('s3'),avg=$('avg'),name=$('name');let total=Number(window.qualState?.total)||5400,remaining=Number(window.qualState?.remaining ?? window.qualState?.total ?? 5400),running=false,deadline=0,interval=null,alarmPlayed=false,audioCtx=null;function fmt(n){n=Math.max(0,Math.ceil(n));return Math.floor(n/3600)+':'+String(Math.floor(n%3600/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function parse(v){const m=/^(\d{1,3}):(\d{2}):(\d{2})$/.exec(v.trim());return m?Number(m[1])*3600+Number(m[2])*60+Number(m[3]):null}function stop(){running=false;if(interval!==null){clearInterval(interval);interval=null}}function render(){const modalStart=$('modalStart');if(modalStart)modalStart.textContent=running?'Pause timer':'Start timer';window.qualSaveTimer?.({total,remaining});if(document.activeElement!==time)time.value=fmt(remaining);start.textContent=running?'Ⅱ PAUSE':'▶ START'}function sound(){window.qualAudio?.play(window.qualAppearance).catch(()=>{});} function done(){stop();remaining=0;if(!alarmPlayed){alarmPlayed=true;sound();time.classList.remove('flash');void time.offsetWidth;time.classList.add('flash')}render()}function tick(){if(!running)return;remaining=Math.max(0,(deadline-performance.now())/1000);if(remaining<=0)done();else render()}function commit(){const n=parse(time.value);if(n!==null){total=n;remaining=n;alarmPlayed=false;time.classList.remove('flash')}render()}let editDigits='',freshEntry=true;
function showDigits(){const digits=editDigits.padStart(6,'0');time.value=Number(digits.slice(0,-4))+':'+digits.slice(-4,-2)+':'+digits.slice(-2);time.setSelectionRange(time.value.length,time.value.length)}
function enterDigits(value){if(freshEntry||time.selectionEnd-time.selectionStart===time.value.length)editDigits='';freshEntry=false;editDigits=(editDigits+value.replace(/\D/g,'')).replace(/^0+(?=\d)/,'').slice(-7);showDigits()}
function deleteDigit(){if(freshEntry){editDigits=String(time.value.replace(/\D/g,'')).replace(/^0+/,'');freshEntry=false}if(time.selectionEnd-time.selectionStart===time.value.length)editDigits='';else editDigits=editDigits.slice(0,-1);showDigits()}
time.addEventListener('focus',()=>{if(running){tick();stop();render()}window.qualAudio?.stop();time.classList.remove('flash');freshEntry=true;editDigits='';time.select()});
time.addEventListener('blur',()=>{commit();time.value=fmt(remaining)});
time.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(/^\d$/.test(e.key)){e.preventDefault();enterDigits(e.key)}else if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();deleteDigit()}else if(e.key==='Enter'){e.preventDefault();time.blur()}else if(e.key===':'){e.preventDefault()}});
time.addEventListener('beforeinput',e=>{if(e.inputType==='insertText'&&e.data){e.preventDefault();enterDigits(e.data)}else if(e.inputType==='deleteContentBackward'||e.inputType==='deleteContentForward'){e.preventDefault();deleteDigit()}});
time.addEventListener('input',()=>{editDigits=time.value.replace(/\D/g,'').slice(-7);freshEntry=false;showDigits()});
time.addEventListener('paste',e=>{e.preventDefault();const text=e.clipboardData.getData('text').trim();freshEntry=true;if(/^\d{1,3}:\d{1,2}(:\d{1,2})?$/.test(text)){const parts=text.split(':');editDigits=(parts.length===3?parts[0]+parts[1].padStart(2,'0')+parts[2].padStart(2,'0'):parts[0]+parts[1].padStart(2,'0')).slice(-7);freshEntry=false;showDigits()}else enterDigits(text)});
start.addEventListener('click',()=>{if(document.activeElement===time)time.blur();if(running){tick();stop();render();return}if(remaining<=0){render();return}window.qualAudio?.stop();window.qualAudio?.unlock();running=true;deadline=performance.now()+remaining*1000;interval=setInterval(tick,100);render()});$('reset').addEventListener('click',()=>{window.qualAudio?.stop();stop();remaining=total;alarmPlayed=false;time.classList.remove('flash');if(document.activeElement===time)time.blur();render()});$('modalStart').addEventListener('click',()=>start.click());$('modalReset').addEventListener('click',()=>$('reset').click());document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||$('settings').open||e.target.closest('input,textarea,select,button,[contenteditable]'))return;if(e.code==='Space'){e.preventDefault();start.click()}else if(e.key.toLowerCase()==='r'){e.preventDefault();$('reset').click()}});document.addEventListener('visibilitychange',()=>{if(running)tick()});function calc(){for(const x of [s1,s2,s3]){const old=x.value,caret=x.selectionStart||0,before=old.slice(0,caret).replace(/\D/g,'').length,digits=old.replace(/\D/g,'').slice(0,7);x.value=digits?Number(digits).toLocaleString('en-US'):'';let p=0,n=0;while(p<x.value.length&&n<before){if(/\d/.test(x.value[p]))n++;p++}if(document.activeElement===x)x.setSelectionRange(p,p)}const count=Number(window.qualAppearance?.scoreCount)===3?3:2;const scores=[s1,s2,s3].slice(0,count);$('score3Row').hidden=count!==3;$('averageLabel').textContent='AO'+count+':';avg.textContent=scores.every(x=>x.value!=='')?(scores.reduce((sum,x)=>sum+Number(x.value.replace(/,/g,'')),0)/count).toLocaleString('en-US',{maximumFractionDigits:1}):'—'}window.qualRecalculate=calc;s1.addEventListener('input',calc);s2.addEventListener('input',calc);s3.addEventListener('input',calc);calc();render()})();
</script><script src="score-editor.js"></script></body></html>
