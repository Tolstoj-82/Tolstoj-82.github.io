<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GBTDC Qual</title><style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e5e3d9;padding:20px;font-family:'Press Start 2P','Courier New',monospace;color:#293e25}.frame{width:100%;max-width:490px;background:#cecdc2;border:3px solid #a5a59b;border-radius:16px 16px 35px 16px;padding:18px;box-shadow:inset 3px 3px #f1f0e9,5px 7px 0 #aaa99e}.bezel{background:#575967;border-radius:10px 10px 25px 10px;padding:14px 13px 22px}.stripe{display:flex;align-items:center;gap:9px;margin-bottom:15px}.lines{flex:1;display:flex;flex-direction:column;gap:5px;min-width:12px}.purple{height:4px;background:#994875;border-radius:2px}.blue{height:4px;background:#455c9e;border-radius:2px}.name{width:170px;max-width:56%;min-width:90px;text-align:center;background:transparent;border:0;outline:none;color:white;font:700 clamp(9px,2.3vw,13px) Arial,sans-serif;letter-spacing:1px;text-transform:uppercase;padding:5px 1px}.name:focus{outline:1px dashed #ddd}.lcd{font-family:'Press Start 2P','Courier New',monospace;background:#acbf87;border:3px solid #7c9064;box-shadow:inset 3px 4px 9px #738955;padding:24px 12px;color:#2b4225}.heading{text-align:center;font-size:clamp(16px,4.5vw,24px);line-height:1.7;margin-bottom:19px}.time{width:100%;background:transparent;border:0;outline:none;text-align:center;font-family:inherit;font-size:clamp(19px,5.3vw,31px);letter-spacing:-1px;color:#293f24;font-variant-numeric:tabular-nums;padding:9px 0}.time:focus{background:#c6d6a1;outline:2px dashed #61764e;border-radius:4px}.flash{animation:blink .35s steps(1,end) 8}@keyframes blink{50%{opacity:0}}.rule{height:2px;background:#758d5e;margin:22px 0 7px}.score-row{display:flex;flex-direction:column;align-items:stretch;gap:13px;padding:21px 0;border-bottom:2px solid #829969;font-size:clamp(14px,3.5vw,18px);line-height:1.6}.score-row input{width:100%;max-width:100%;text-align:right;background:transparent;border:0;border-bottom:1px dashed #738a60;outline:none;color:#2b4225;font-family:inherit;font-size:clamp(17px,4.6vw,23px);border-radius:0;padding:8px 0;min-width:0}.score-row input:focus{background:#c6d6a1}.average{display:block;width:100%;font-size:clamp(17px,4.6vw,23px);overflow-wrap:anywhere;text-align:right;line-height:1.8}.actions{display:flex;justify-content:center;gap:20px;margin:25px 0 8px;flex-wrap:wrap}.actions button{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:800;letter-spacing:1px;border:2px solid #622344;background:linear-gradient(145deg,#a44a7b,#79284f);color:#fff0f7;border-radius:999px;padding:14px 24px;cursor:pointer;box-shadow:inset 1px 2px 2px #c26b9a,0 5px 0 #4a2039,0 7px 5px #34462a55}.actions button:active{transform:translateY(4px);box-shadow:inset 1px 2px 4px #4d1936,0 1px 0 #4a2039}
</style></head><body><main class="frame"><div class="bezel"><div class="stripe"><div class="lines"><div class="purple"></div><div class="blue"></div></div><input class="name" id="name" value="DOT MATRIX" maxlength="22" aria-label="Custom name"><div class="lines"><div class="purple"></div><div class="blue"></div></div></div><div class="lcd"><div class="heading">GBTDC Qual</div><input class="time" id="time" value="1:30:00" aria-label="Hours minutes seconds"><div class="rule"></div><div class="score-row"><label for="s1">SCORE 1:</label><input id="s1" type="text" inputmode="numeric" placeholder="0"></div><div class="score-row"><label for="s2">SCORE 2:</label><input id="s2" type="text" inputmode="numeric" placeholder="0"></div><div class="score-row" style="border-bottom:0"><span>AVERAGE:</span><span class="average" id="avg">—</span></div></div></div><div class="actions"><button id="start">▶ START</button><button id="reset">↺ RESET</button></div></main><script>
(()=>{const $=id=>document.getElementById(id),time=$('time'),start=$('start'),s1=$('s1'),s2=$('s2'),avg=$('avg'),name=$('name');let total=5400,remaining=5400,running=false,deadline=0,interval=null,alarmPlayed=false,audioCtx=null;name.addEventListener('input',()=>name.value=name.value.toUpperCase());function fmt(n){n=Math.max(0,Math.ceil(n));return Math.floor(n/3600)+':'+String(Math.floor(n%3600/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function parse(v){const m=/^(\d{1,3}):([0-5]?\d):([0-5]?\d)$/.exec(v.trim());return m?Number(m[1])*3600+Number(m[2])*60+Number(m[3]):null}function stop(){running=false;if(interval!==null){clearInterval(interval);interval=null}}function render(){if(document.activeElement!==time)time.value=fmt(remaining);start.textContent=running?'Ⅱ PAUSE':'▶ START'}function sound(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audioCtx)audioCtx=new C();if(audioCtx.state==='suspended')audioCtx.resume();const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(880,t);o.frequency.exponentialRampToValueAtTime(660,t+.35);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.65);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.67)}catch(e){}}function done(){stop();remaining=0;if(!alarmPlayed){alarmPlayed=true;sound();time.classList.remove('flash');void time.offsetWidth;time.classList.add('flash')}render()}function tick(){if(!running)return;remaining=Math.max(0,(deadline-performance.now())/1000);if(remaining<=0)done();else render()}function commit(){const n=parse(time.value);if(n!==null){total=n;remaining=n;alarmPlayed=false;time.classList.remove('flash')}render()}time.addEventListener('focus',()=>{if(running){tick();stop()}time.classList.remove('flash');time.select()});time.addEventListener('blur',commit);time.addEventListener('keydown',e=>{if(e.key==='Enter')time.blur()});start.addEventListener('click',()=>{if(document.activeElement===time)time.blur();if(running){tick();stop();render();return}if(remaining<=0){render();return}try{const C=window.AudioContext||window.webkitAudioContext;if(C){if(!audioCtx)audioCtx=new C();audioCtx.resume()}}catch(e){}running=true;deadline=performance.now()+remaining*1000;interval=setInterval(tick,100);render()});$('reset').addEventListener('click',()=>{stop();remaining=total;alarmPlayed=false;time.classList.remove('flash');if(document.activeElement===time)time.blur();render()});document.addEventListener('visibilitychange',()=>{if(running)tick()});function calc(){for(const x of [s1,s2]){const old=x.value,caret=x.selectionStart||0,before=old.slice(0,caret).replace(/\D/g,'').length,digits=old.replace(/\D/g,'').slice(0,7);x.value=digits?Number(digits).toLocaleString('en-US'):'';let p=0,n=0;while(p<x.value.length&&n<before){if(/\d/.test(x.value[p]))n++;p++}if(document.activeElement===x)x.setSelectionRange(p,p)}avg.textContent=s1.value&&s2.value?((Number(s1.value.replace(/,/g,''))+Number(s2.value.replace(/,/g,'')))/2).toLocaleString('en-US',{maximumFractionDigits:1}):'—'}s1.addEventListener('input',calc);s2.addEventListener('input',calc);render()})();
</script></body></html>
