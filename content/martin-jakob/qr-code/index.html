<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    
    <style>
      
      body {
        text-align: center;
        font-family: "Poppins", sans-serif;
        background-color: #f4f4f4;
        color: #333;
      }
      .container {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        display: inline-block;
        margin-top: 40px;
      }
      input[type="text"],
      select,
      input[type="range"] {
        padding: 8px;
        margin: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      input[type="color"] {
        padding: 0px;
        margin: 0px;
        border: none;
        cursor: pointer;
      }
      input[type="color"]::-webkit-color-swatch {
        border-radius: 5px;
        border: 2px solid #888;
      }
      button {
        background: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        margin-top: 20px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s ease-in-out;
      }
      button:hover {
        background: #0056b3;
      }
      p {
        font-weight: bold;
      }
      label {
        display: inline-block;
        margin-right: 10px;
      }
      #sizeSlider {
        display: block;
        margin: 10px auto;
      }
      canvas {
        box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.3);
        border-radius: 20px;
      }
      #labelContainer {
        text-align: center;
        margin: 10px 0 20px 0;
      }
      #qrTitle {
        font-size: 28px;
        font-weight: 700;
        color: #222;
      }
      #qrSubtitle {
        font-size: 18px;
        color: #666;
        margin-top: 5px;
      }
      h1{
        text-align:center;
      }
      #dropZone{
          border:3px dashed #888;
          border-radius:12px;
          background:white;
          padding:80px;
          text-align:center;
          cursor:pointer;
          transition:all .2s;
      } 
      #dropZone.dragover{
          border-color:#0078d4;
          background:#eef6ff;
      }
      #info{
          margin-top:20px;
          font-size:18px;
      }
      #status{
          margin-top:15px;
          font-weight:bold;
      }
      button{
          margin-top:20px;
          padding:12px 25px;
          border:none;
          background:#0078d4;
          color:white;
          border-radius:6px;
          cursor:pointer;
          font-size:16px;
      }
      
      button:disabled{
          background:#999;
          cursor:not-allowed;
      }
    
    </style>
    
  </head>
  <body>
    <p>
      <label for="qrInput">Adresse</label>
      <input
        type="text"
        id="qrInput"
        placeholder="Text..."
      />
    </p>
    <p>
      <label for="shapeSelect">QR Code</label>
      <select id="shapeSelect">
        <option value="square">Eckig</option>
        <option value="circle">Rund</option>
        <option value="rounded">Abgerundet</option>
        <option value="diamond">Raute</option>
        <option value="horizontal">Horizontal</option>
        <option value="vertical">Vertikal</option>
        <option value="dot">Kleinere Punkte</option>
      </select>
      <input
        type="color"
        id="colorPicker"
        value="#000000"
        aria-label="QR code color"
      />
      |
      <label for="finderShapeSelect">Finder</label>
      <select id="finderShapeSelect">
        <option value="square">Eckig</option>
        <option value="circle">Rund</option>
        <option value="circular">Kreisförmig</option>
        <option value="rounded-square">Abgerundetes Quadrat</option>
        <option value="diamond">Raute</option>
        <option value="ring">Ring</option>
        <option value="square-circle">Quadrat mit Kreis</option>
        <option value="circle-square">Kreis mit Quadrat</option>
      </select>
      <input
        type="color"
        id="finderColorPicker"
        value="#000000"
        aria-label="Finder color"
      />
    </p>
    <input
      type="range"
      id="sizeSlider"
      min="200"
      max="700"
      value="300"
      aria-label="QR code size"
    />

    <div id="labelContainer">
      <div id="qrTitle"></div>
      <div id="qrSubtitle"></div>
    </div>

    <p><canvas id="qrCanvas" aria-label="Generated QR code"></canvas></p>
    <button id="downloadBtn" type="button" style="display: none">
      Download
    </button>

    <div id="dropZone">
    <strong>Drop JSON here</strong><br><br>
    or click to browse
</div>

<input
    type="file"
    id="fileInput"
    accept=".json"
    hidden
>

<div id="info"></div>

<button
    id="generateBtn"
    disabled
>
    Generate ZIP
</button>

<div id="status"></div>
<script>
const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const info = document.getElementById("info");
const statusDiv = document.getElementById("status");
const generateBtn = document.getElementById("generateBtn");

const qrInput = document.getElementById("qrInput");
const shapeSelect = document.getElementById("shapeSelect");
const colorPicker = document.getElementById("colorPicker");
const finderShapeSelect = document.getElementById("finderShapeSelect");
const finderColorPicker = document.getElementById("finderColorPicker");
const sizeSlider = document.getElementById("sizeSlider");
const canvas = document.getElementById("qrCanvas");
const downloadBtn = document.getElementById("downloadBtn");
const qrTitle = document.getElementById("qrTitle");
const qrSubtitle = document.getElementById("qrSubtitle");
const ctx = canvas.getContext("2d");

let loadedData = null;

dropZone.addEventListener("click", () => {
    fileInput.click();
});

fileInput.addEventListener("change", e => {

    if(e.target.files.length){
        loadFile(e.target.files[0]);
    }

});

dropZone.addEventListener("dragover", e => {
    e.preventDefault();
    dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave", () => {
    dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop", e => {

    e.preventDefault();
    dropZone.classList.remove("dragover");

    const file = e.dataTransfer.files[0];

    if(file){
        loadFile(file);
    }

});

async function loadFile(file){

    try{

        const text = await file.text();

        loadedData = JSON.parse(text);

        info.innerHTML =
            `<strong>File:</strong> ${file.name}<br>
             <strong>Records:</strong> ${loadedData.length}`;

        generateBtn.disabled = false;

        statusDiv.innerHTML = "";

    }
    catch(error){

        alert(
            "Invalid JSON:\n\n" +
            error.message
        );

    }

}

function sanitizeFilename(text){

    return (text || "QR")
        .replace(/[<>:"/\\|?*]/g, "_")
        .replace(/\s+/g, "_")
        .trim();

}

function createQRImage(entry){

    return new Promise(resolve => {

        const url =
            "https://mobileinfo.test.bernmobil.ch/stop/" +
            entry.Interne_ID;

        const qr = qrcode(0, "H");

        qr.addData(url);
        qr.make();

        const modules = qr.getModuleCount();

        const width = 1000;
        const qrSize = 850;

        const title = entry.Titel || "";
        const subtitle = entry.Untertitel || "";

        const headerHeight =
            subtitle.trim() !== ""
                ? 140
                : 90;

        const exportCanvas = document.createElement("canvas");
        const exportCtx = exportCanvas.getContext("2d");

        canvas.width = width;
        canvas.height = qrSize + headerHeight;

        ctx.fillStyle = "white";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.textAlign = "center";

        if(title){

            ctx.fillStyle = "#000";

            ctx.font = "bold 42px Arial";

            ctx.fillText(
                title,
                width / 2,
                50
            );

        }

        if(subtitle){

            ctx.fillStyle = "#666";

            ctx.font = "24px Arial";

            ctx.fillText(
                subtitle,
                width / 2,
                90
            );

        }

        const moduleSize =
            Math.floor((qrSize * 0.8) / modules);

        const actualQRSize =
            modules * moduleSize;

        const qrOffsetX =
            Math.floor(
                (width - actualQRSize) / 2
            );

        const qrOffsetY =
            headerHeight +
            Math.floor(
                (qrSize - actualQRSize) / 2
            );

        ctx.fillStyle = "#000";

        for(let row=0; row<modules; row++){

            for(let col=0; col<modules; col++){

                if(!qr.isDark(row,col)){
                    continue;
                }

                ctx.fillRect(
                    qrOffsetX + col * moduleSize,
                    qrOffsetY + row * moduleSize,
                    moduleSize,
                    moduleSize
                );

            }

        }

        canvas.toBlob(blob => {

            resolve(blob);

        }, "image/png");

    });

}

generateBtn.addEventListener(
    "click",
    generateZip
);

async function generateZip(){

    if(!loadedData){
        return;
    }

    try{

        generateBtn.disabled = true;

        const zip = new JSZip();

        for(let i=0; i<loadedData.length; i++){

            const entry = loadedData[i];

            statusDiv.innerHTML =
                `Generating ${i + 1} / ${loadedData.length}`;

            const image =
                await createQRImage(entry);

            const fileName =
                sanitizeFilename(
                    entry.Titel ||
                    entry.Interne_ID
                ) + ".png";

            zip.file(
                fileName,
                image
            );

        }

        statusDiv.innerHTML =
            "Creating ZIP...";

        const zipBlob =
            await zip.generateAsync({
                type:"blob"
            });

        saveAs(
            zipBlob,
            "QR-Codes.zip"
        );

        statusDiv.innerHTML =
            `Done! Generated ${loadedData.length} QR codes.`;

    }
    catch(error){

        console.error(error);

        alert(error.message);

    }
    finally{

        generateBtn.disabled = false;

    }

}



      function clearQRCode() {
        canvas.width = Number.parseInt(sizeSlider.value, 10);
        canvas.height = canvas.width;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        downloadBtn.style.display = "none";
      }

      function roundedRectPath(context, x, y, width, height, radius) {
        const safeRadius = Math.min(radius, width / 2, height / 2);
        context.beginPath();
        context.moveTo(x + safeRadius, y);
        context.lineTo(x + width - safeRadius, y);
        context.quadraticCurveTo(x + width, y, x + width, y + safeRadius);
        context.lineTo(x + width, y + height - safeRadius);
        context.quadraticCurveTo(x + width, y + height, x + width - safeRadius, y + height);
        context.lineTo(x + safeRadius, y + height);
        context.quadraticCurveTo(x, y + height, x, y + height - safeRadius);
        context.lineTo(x, y + safeRadius);
        context.quadraticCurveTo(x, y, x + safeRadius, y);
        context.closePath();
      }

      function diamondPath(context, centerX, centerY, radius) {
        context.beginPath();
        context.moveTo(centerX, centerY - radius);
        context.lineTo(centerX + radius, centerY);
        context.lineTo(centerX, centerY + radius);
        context.lineTo(centerX - radius, centerY);
        context.closePath();
      }

      function drawModule(shape, x, y, size) {
        const centerX = x + size / 2;
        const centerY = y + size / 2;

        switch (shape) {
          case "circle":
            ctx.beginPath();
            ctx.arc(centerX, centerY, size / 2, 0, Math.PI * 2);
            ctx.fill();
            break;
          case "rounded":
            roundedRectPath(ctx, x, y, size, size, size * 0.3);
            ctx.fill();
            break;
          case "diamond":
            diamondPath(ctx, centerX, centerY, size / 2);
            ctx.fill();
            break;
          case "horizontal":
            roundedRectPath(ctx, x, y + size * 0.15, size, size * 0.7, size * 0.35);
            ctx.fill();
            break;
          case "vertical":
            roundedRectPath(ctx, x + size * 0.15, y, size * 0.7, size, size * 0.35);
            ctx.fill();
            break;
          case "dot":
            ctx.beginPath();
            ctx.arc(centerX, centerY, size * 0.35, 0, Math.PI * 2);
            ctx.fill();
            break;
          default:
            ctx.fillRect(x, y, size, size);
        }
      }

      function loadQueryParameters() {
        const params = new URLSearchParams(window.location.search);

        const url = params.get("url");
        const title = params.get("title");
        const subtitle = params.get("subtitle");

        if (url) {
          qrInput.value = url;
        }

        qrTitle.textContent = title || "";
        qrSubtitle.textContent = subtitle || "";

        if (title) {
          document.title = title;
        }
      }

      function generateQRCode() {
        const inputText = qrInput.value.trim();

        if (inputText === "") {
          clearQRCode();
          return;
        }

        if (typeof qrcode !== "function") {
          downloadBtn.style.display = "none";
          console.error("The QR code library could not be loaded.");
          return;
        }

        try {
          const qr = qrcode(0, "H");
          qr.addData(inputText);
          qr.make();

          const modules = qr.getModuleCount();
          const shape = shapeSelect.value;
          const finderShape = finderShapeSelect.value;
          const color = colorPicker.value;
          const finderColor = finderColorPicker.value;
          const size = Number.parseInt(sizeSlider.value, 10);

          canvas.width = size;
          canvas.height = size;
          ctx.fillStyle = "white";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          const moduleSize = Math.max(1, Math.floor((size * 0.8) / modules));
          const actualQRSize = moduleSize * modules;
          const padding = Math.floor((canvas.width - actualQRSize) / 2);

          function drawFinderPattern(style, column, row) {
            const x = padding + column * moduleSize;
            const y = padding + row * moduleSize;
            const centerX = padding + (column + 3.5) * moduleSize;
            const centerY = padding + (row + 3.5) * moduleSize;

            ctx.fillStyle = finderColor;
            if (style === "rounded-square") {
              roundedRectPath(ctx, x, y, moduleSize * 7, moduleSize * 7, moduleSize * 1.25);
              ctx.fill();
              ctx.fillStyle = "white";
              roundedRectPath(ctx, x + moduleSize, y + moduleSize, moduleSize * 5, moduleSize * 5, moduleSize * 0.8);
              ctx.fill();
              ctx.fillStyle = finderColor;
              roundedRectPath(ctx, x + moduleSize * 2, y + moduleSize * 2, moduleSize * 3, moduleSize * 3, moduleSize * 0.5);
              ctx.fill();
            } else if (style === "diamond") {
              diamondPath(ctx, centerX, centerY, moduleSize * 3.5);
              ctx.fill();
              ctx.fillStyle = "white";
              diamondPath(ctx, centerX, centerY, moduleSize * 2.5);
              ctx.fill();
              ctx.fillStyle = finderColor;
              diamondPath(ctx, centerX, centerY, moduleSize * 1.5);
              ctx.fill();
            } else if (style === "square-circle") {
              ctx.fillRect(x, y, moduleSize * 7, moduleSize * 7);
              ctx.fillStyle = "white";
              ctx.fillRect(x + moduleSize, y + moduleSize, moduleSize * 5, moduleSize * 5);
              ctx.fillStyle = finderColor;
              ctx.beginPath();
              ctx.arc(centerX, centerY, moduleSize * 1.5, 0, Math.PI * 2);
              ctx.fill();
            } else if (style === "circle-square") {
              ctx.beginPath();
              ctx.arc(centerX, centerY, moduleSize * 3.5, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = "white";
              ctx.fillRect(x + moduleSize, y + moduleSize, moduleSize * 5, moduleSize * 5);
              ctx.fillStyle = finderColor;
              ctx.fillRect(x + moduleSize * 2, y + moduleSize * 2, moduleSize * 3, moduleSize * 3);
            } else {
              ctx.beginPath();
              ctx.arc(centerX, centerY, moduleSize * 3.5, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = "white";
              ctx.beginPath();
              ctx.arc(centerX, centerY, moduleSize * 2.5, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = finderColor;

              if (style === "ring") {
                ctx.fillRect(
                  centerX - moduleSize * 1.5,
                  centerY - moduleSize * 1.5,
                  moduleSize * 3,
                  moduleSize * 3
                );
              } else {
                ctx.beginPath();
                ctx.arc(centerX, centerY, moduleSize * 1.5, 0, Math.PI * 2);
                ctx.fill();
              }
            }
          }

          const customFinderStyles = new Set([
            "circular",
            "rounded-square",
            "diamond",
            "ring",
            "square-circle",
            "circle-square"
          ]);

          for (let row = 0; row < modules; row++) {
            for (let col = 0; col < modules; col++) {
              if (!qr.isDark(row, col)) continue;

              const x = padding + col * moduleSize;
              const y = padding + row * moduleSize;
              const isFinderPattern =
                (row < 7 && col < 7) ||
                (row < 7 && col > modules - 8) ||
                (row > modules - 8 && col < 7);

              if (isFinderPattern && customFinderStyles.has(finderShape)) continue;

              const drawShape = isFinderPattern ? finderShape : shape;
              ctx.fillStyle = isFinderPattern ? finderColor : color;

              drawModule(drawShape, x, y, moduleSize);
            }
          }

          if (customFinderStyles.has(finderShape)) {
            drawFinderPattern(finderShape, 0, 0);
            drawFinderPattern(finderShape, modules - 7, 0);
            drawFinderPattern(finderShape, 0, modules - 7);
          }

          downloadBtn.style.display = "inline-block";
        } catch (error) {
          clearQRCode();
          console.error("The supplied text could not be encoded as a QR code.", error);
        }
      }

      function downloadQRCode() {
        if (qrInput.value.trim() === "") return;

        const title = qrTitle.textContent;
        const subtitle = qrSubtitle.textContent;

        const exportCanvas = document.createElement("canvas");
        const exportCtx = exportCanvas.getContext("2d");

        let headerHeight = 0;

        if (title) headerHeight += 50;
        if (subtitle) headerHeight += 30;

        headerHeight += 20;

        exportCanvas.width = canvas.width;
        exportCanvas.height = canvas.height + headerHeight;

        exportCtx.fillStyle = "white";
        exportCtx.fillRect(
          0,
          0,
          exportCanvas.width,
          exportCanvas.height
        );

        let y = 35;

        if (title) {
          exportCtx.fillStyle = "#222";
          exportCtx.font = "bold 28px Arial";
          exportCtx.textAlign = "center";
          exportCtx.fillText(
            title,
            exportCanvas.width / 2,
            y
          );
          y += 35;
        }

        if (subtitle) {
          exportCtx.fillStyle = "#666";
          exportCtx.font = "18px Arial";
          exportCtx.textAlign = "center";
          exportCtx.fillText(
            subtitle,
            exportCanvas.width / 2,
            y
          );
        }

        exportCtx.drawImage(
          canvas,
          0,
          headerHeight
        );

        const safeName =
          (title || "QR-code")
            .replace(/[<>:"/\\|?*]/g, "_")
            .trim();

        const link = document.createElement("a");
        link.download = `${safeName}.png`;
        link.href = exportCanvas.toDataURL("image/png");
        link.click();
      }
      [
        qrInput,
        shapeSelect,
        colorPicker,
        finderShapeSelect,
        finderColorPicker,
        sizeSlider
      ].forEach((control) => control.addEventListener("input", generateQRCode));

      downloadBtn.addEventListener("click", downloadQRCode);

      loadQueryParameters();

      if (qrInput.value.trim()) {
        generateQRCode();
      } else {
        clearQRCode();
      }
    </script>
  </body>
</html>
