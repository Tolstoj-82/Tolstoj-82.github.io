<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Generator</title>
    <script defer src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    
    <link rel="stylesheet" href="styles.css" />
    <script defer src="script.js"></script>
    
  </head>
  <body>
    <p>
      <label for="qrInput">Adresse</label>
      <input
        type="text"
        id="qrInput"
        placeholder="Text..."
      />
    </p>
    <p>
      <label for="shapeSelect">QR Code</label>
      <select id="shapeSelect">
        <option value="square">Eckig</option>
        <option value="circle">Rund</option>
        <option value="rounded">Abgerundet</option>
        <option value="diamond">Raute</option>
        <option value="horizontal">Horizontal</option>
        <option value="vertical">Vertikal</option>
        <option value="dot">Kleinere Punkte</option>
      </select>
      <input
        type="color"
        id="colorPicker"
        value="#000000"
        aria-label="QR code color"
      />
      |
      <label for="finderShapeSelect">Finder</label>
      <select id="finderShapeSelect">
        <option value="square">Eckig</option>
        <option value="circle">Rund</option>
        <option value="circular">Kreisförmig</option>
        <option value="rounded-square">Abgerundetes Quadrat</option>
        <option value="diamond">Raute</option>
        <option value="ring">Ring</option>
        <option value="square-circle">Quadrat mit Kreis</option>
        <option value="circle-square">Kreis mit Quadrat</option>
      </select>
      <input
        type="color"
        id="finderColorPicker"
        value="#000000"
        aria-label="Finder color"
      />
    </p>
    <input
      type="range"
      id="sizeSlider"
      min="200"
      max="700"
      value="300"
      aria-label="QR code size"
    />

    <div id="labelContainer">
      <div id="qrTitle"></div>
      <div id="qrSubtitle"></div>
    </div>

    <p><canvas id="qrCanvas" aria-label="Generated QR code"></canvas></p>
    <button id="downloadBtn" type="button" hidden>
      Download
    </button>
    <div class="import-disclosure">
      <button id="toggleImportBtn" type="button" aria-expanded="false" aria-controls="bulkImport">Massenimport <span aria-hidden="true"></span></button>
    </div>
    <section id="bulkImport" aria-label="Massenimport" hidden>
      <hr />

    <div id="dropZone" role="button" tabindex="0" aria-label="JSON-Datei importieren">
    <strong>Droppe ein JSON hier!</strong><br><br>
    oder Klicke das Feld.
</div>

<input
    type="file"
    id="fileInput"
    accept=".json"
    hidden
>

<div id="info" aria-live="polite"></div>

<button
    id="generateBtn"
    disabled
>
   Generiere ein ZIP-File
</button>

<div id="status" role="status"></div>
    </section>
    <p id="qrError" role="alert"></p>

  </body>
</html>
